name: Увага України — щоденний збір

on:
  schedule:
    # UTC, кожні 6 год. Точна година не важлива: сплески Google тримає 7 діб,
    # Вікіпедія добирає 14 діб. Чотири слоти потрібні Explore: Google пускає ~14 запитів
    # поспіль, тож денна норма (~40) добирається частинами; повний день — запуски по ~1 хв.
    - cron: "15 5 * * *"
    - cron: "15 11 * * *"
    - cron: "15 17 * * *"
    - cron: "15 23 * * *"
  workflow_dispatch:

concurrency:
  group: ua-attention
  cancel-in-progress: false

permissions:
  contents: write
  pages: write        # викладення сторінки на GitHub Pages
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      UA_ATT_RUNNER: actions
    steps:
      - uses: actions/checkout@v4

      - name: Шар 1 — сплески (Trending Now)
        continue-on-error: true
        run: python3 collect_trending.py

      - name: Шар 4 — Вікіпедія
        continue-on-error: true
        run: python3 collect_wiki.py

      - name: Шари 2–3 — обсяг (Explore)
        # Google охоче ріже хмарні адреси кодом 429. Недобране того ж дня добере ноутбук.
        continue-on-error: true
        run: python3 collect_explore.py

      - name: Сторінка — перезбір
        # Після кожного збору: зіставлення шарів, блок «Вчора», site/index.html.
        # Перед комітом — щоб кеш перевірки Вікіпедії (data/cache) теж потрапив у git.
        if: always()
        continue-on-error: true
        run: |
          python3 analysis/compare.py > /dev/null
          python3 analysis/telegram_spikes.py > /dev/null
          python3 analysis/assemble.py > /dev/null
          python3 analysis/build_page.py

      - name: Зберегти зміни
        run: |
          git config user.name "ua-attention-collector"
          git config user.email "collector@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "змін немає"
          else
            git commit -m "збір $(TZ=Europe/Kyiv date '+%Y-%m-%d %H:%M Київ')"
            git pull --rebase --autostash
            git push
          fi

      - name: Підсумок
        run: tail -4 data/log.ndjson

      - name: Сторінка — пакет для Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: collect
    if: always() && needs.collect.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
