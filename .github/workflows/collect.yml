name: Увага України — щоденний збір

on:
  schedule:
    # UTC. Улітку це 08:15 і 20:15 за Києвом, узимку 07:15 і 19:15 — точна година не важлива:
    # сплески Google тримає 7 діб, Вікіпедія добирає 14 діб, Explore — раз на київську добу.
    - cron: "15 5 * * *"
    - cron: "15 17 * * *"
  workflow_dispatch:

concurrency:
  group: ua-attention
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      UA_ATT_RUNNER: actions
    steps:
      - uses: actions/checkout@v4

      - name: Шар 1 — сплески (Trending Now)
        continue-on-error: true
        run: python3 collect_trending.py

      - name: Шар 4 — Вікіпедія
        continue-on-error: true
        run: python3 collect_wiki.py

      - name: Шари 2–3 — обсяг (Explore)
        # Google охоче ріже хмарні адреси кодом 429. Недобране того ж дня добере ноутбук.
        continue-on-error: true
        run: python3 collect_explore.py

      - name: Зберегти зміни
        run: |
          git config user.name "ua-attention-collector"
          git config user.email "collector@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "змін немає"
          else
            git commit -m "збір $(TZ=Europe/Kyiv date '+%Y-%m-%d %H:%M Київ')"
            git pull --rebase
            git push
          fi

      - name: Підсумок
        run: tail -4 data/log.ndjson
