name: Метро — глибини станцій

# Разовий збір, не щоденний: глибина станції не змінюється. Запускається, коли
# змінився сам збирач, і вручну. Коміт робить GITHUB_TOKEN — себе він не перезапускає.
on:
  push:
    branches: ["claude/kyiv-metro-*"]
    paths:
      - collect_metro.py
      - .github/workflows/metro.yml
  workflow_dispatch:

concurrency:
  group: ua-attention-metro
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UA_ATT_RUNNER: actions
    steps:
      - uses: actions/checkout@v4

      - name: Розвідка — чи є глибини в англійській Вікіпедії
        run: |
          python3 - <<'PY'
          import json, re, urllib.parse, collect_metro as m
          from lib import WIKI_UA, fetch
          probe = ["Хрещатик", "Позняки", "Оболонь", "Кловська", "Вокзальна", "Видубичі",
                   "Лук'янівська", "Осокорки", "Поштова площа", "Деміївська"]
          uk = [f"{n} (станція метро)" for n in probe]
          d = m.api(action="query", titles="|".join(uk), redirects=1, prop="langlinks",
                    lllang="en", lllimit="max")
          en = {}
          for p in d["query"]["pages"]:
              for l in p.get("langlinks", []):
                  en[p["title"]] = l["title"]
          print("міжмовні посилання:", json.dumps(en, ensure_ascii=False, indent=1))
          if not en: raise SystemExit("англійських статей не знайдено")
          url = ("https://en.wikipedia.org/w/api.php?" + urllib.parse.urlencode(
              {"action": "query", "titles": "|".join(en.values()), "prop": "revisions",
               "rvprop": "content", "rvslots": "main", "redirects": 1,
               "format": "json", "formatversion": "2"}))
          for p in json.loads(fetch(url, ua=WIKI_UA, waits=(5, 20)))["query"]["pages"]:
              if p.get("missing"): print(p["title"], "— немає"); continue
              txt = p["revisions"][0]["slots"]["main"]["content"]
              hits = re.findall(r"(?i)^\s*\|\s*(depth[^=]*)=\s*([^\n]{0,60})", txt, flags=re.M)
              prose = re.findall(r"(?i)depth[^.\n]{0,50}?(\d+(?:\.\d+)?)\s*(?:m\b|met)", txt)
              print(f'{p["title"]:44s} інфобокс={hits} текст={prose[:3]}')
          PY

      - name: Зібрати глибини з Вікіпедії
        run: python3 collect_metro.py

      - name: Що зібралося
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("data/metro/stations.json"))
          for s in d["stations"]:
              print(f'{s["line"]} {s["order"]:2d} {s["name"]:24s} '
                    f'{"" if s["depth"] is None else s["depth"]:>6} {s["depth_src"] or "—":8s} '
                    f'{s["lat"]} {s["lon"]}')
          PY

      - name: Зберегти
        run: |
          git config user.name "ua-attention-collector"
          git config user.email "collector@users.noreply.github.com"
          git add data/metro
          if git diff --staged --quiet; then
            echo "змін немає"
          else
            git commit -m "метро: глибини станцій з Вікіпедії"
            git pull --rebase --autostash
            git push
          fi
