name: Метро — глибини станцій

# Разовий збір, не щоденний: глибина станції не змінюється. Запускається, коли
# змінився сам збирач, і вручну. Коміт робить GITHUB_TOKEN — себе він не перезапускає.
on:
  push:
    branches: ["claude/kyiv-metro-*"]
    paths:
      - collect_metro.py
      - .github/workflows/metro.yml
  workflow_dispatch:

concurrency:
  group: ua-attention-metro
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UA_ATT_RUNNER: actions
    steps:
      - uses: actions/checkout@v4

      - name: Розвідка — які поля насправді в інфобоксі
        run: |
          python3 - <<'PY'
          import re, collect_metro as m
          got = m.pages(["Хрещатик (станція метро)", "Університет (станція метро)",
                         "Позняки (станція метро)", "Славутич (станція метро)"])
          for title, p in got.items():
              print("=" * 70); print(title, "→", None if p is None else p["title"], p and (p["lat"], p["lon"]))
              if not p: continue
              head = p["text"][:2600]
              print("--- поля інфобоксу:")
              for f in re.findall(r"\n\s*\|\s*([^=|\n]{1,40}?)\s*=([^\n]{0,70})", head):
                  print(f"    |{f[0]}| = {f[1]}")
              print("--- перші рядки тексту:")
              body = re.sub(r"^.*?\n\}\}", "", p["text"], flags=re.S)[:600]
              print(body.replace("\n", " ")[:600])
          PY

      - name: Зібрати глибини з Вікіпедії
        run: python3 collect_metro.py

      - name: Що зібралося
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("data/metro/stations.json"))
          for s in d["stations"]:
              print(f'{s["line"]} {s["order"]:2d} {s["name"]:24s} '
                    f'{"" if s["depth"] is None else s["depth"]:>6} {s["depth_src"] or "—":8s} '
                    f'{s["lat"]} {s["lon"]}')
          PY

      - name: Зберегти
        run: |
          git config user.name "ua-attention-collector"
          git config user.email "collector@users.noreply.github.com"
          git add data/metro
          if git diff --staged --quiet; then
            echo "змін немає"
          else
            git commit -m "метро: глибини станцій з Вікіпедії"
            git pull --rebase --autostash
            git push
          fi
