name: Метро — глибини станцій

# Разовий збір, не щоденний: глибина станції не змінюється. Запускається, коли
# змінився сам збирач, і вручну. Коміт робить GITHUB_TOKEN — себе він не перезапускає.
on:
  push:
    branches: ["claude/kyiv-metro-*"]
    paths:
      - collect_metro.py
      - .github/workflows/metro.yml
  workflow_dispatch:

concurrency:
  group: ua-attention-metro
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UA_ATT_RUNNER: actions
    steps:
      - uses: actions/checkout@v4

      - name: Розвідка — чи є глибини у статті-списку станцій
        run: |
          python3 - <<'PY'
          import re, collect_metro as m
          t = "Список станцій Київського метрополітену"
          p = m.pages([t])[t]
          txt = p["text"]
          print("розмір:", len(txt))
          i = txt.lower().find("глибин")
          print("слово «глибин» уперше на позиції:", i)
          if i > 0:
              print("--- контекст:"); print(txt[max(0, i - 900):i + 900])
          print("--- заголовки таблиць:")
          for h in re.findall(r"^!.*$", txt, flags=re.M)[:30]:
              print("   ", h[:160])
          PY

      - name: Зібрати глибини з Вікіпедії
        run: python3 collect_metro.py

      - name: Що зібралося
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("data/metro/stations.json"))
          for s in d["stations"]:
              print(f'{s["line"]} {s["order"]:2d} {s["name"]:24s} '
                    f'{"" if s["depth"] is None else s["depth"]:>6} {s["depth_src"] or "—":8s} '
                    f'{s["lat"]} {s["lon"]}')
          PY

      - name: Зберегти
        run: |
          git config user.name "ua-attention-collector"
          git config user.email "collector@users.noreply.github.com"
          git add data/metro
          if git diff --staged --quiet; then
            echo "змін немає"
          else
            git commit -m "метро: глибини станцій з Вікіпедії"
            git pull --rebase --autostash
            git push
          fi
